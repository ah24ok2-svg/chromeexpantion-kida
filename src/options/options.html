<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Gmail 新着トースト — 設定</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="page">
    <header class="page-head">
      <h1>Gmail 新着トースト</h1>
      <p class="lead">
        Gmail の新着を一定間隔で確認し、いま見ているページの隅に件名のトーストを出します。
        デスクトップ通知は使わないため、URL やオリジンの表記は一切出ません。
      </p>
    </header>

    <section class="card">
      <h2>基本</h2>
      <label class="row switch-row">
        <span>
          <span class="label">新着を通知する</span>
          <span class="hint">オフにすると確認もトーストも止まります。</span>
        </span>
        <input type="checkbox" id="enabled" />
      </label>

      <label class="row">
        <span>
          <span class="label">確認する間隔</span>
          <span class="hint">Chrome の制限により最短 1 分です。</span>
        </span>
        <select id="intervalMinutes">
          <option value="1">1 分</option>
          <option value="2">2 分</option>
          <option value="5">5 分</option>
          <option value="10">10 分</option>
          <option value="15">15 分</option>
          <option value="30">30 分</option>
          <option value="60">60 分</option>
        </select>
      </label>

      <label class="row">
        <span>
          <span class="label">アカウント番号</span>
          <span class="hint">
            Gmail の URL <code>mail.google.com/mail/u/<b>0</b></code> の数字。
            複数見るときはカンマ区切り（例: <code>0,1</code>）。
          </span>
        </span>
        <input type="text" id="accounts" inputmode="numeric" placeholder="0" />
      </label>
    </section>

    <section class="card">
      <h2>トーストの見た目</h2>
      <label class="row">
        <span class="label">表示位置</span>
        <select id="position">
          <option value="bottom-right">右下</option>
          <option value="bottom-left">左下</option>
          <option value="top-right">右上</option>
          <option value="top-left">左上</option>
        </select>
      </label>

      <label class="row">
        <span>
          <span class="label">自動で消えるまで</span>
          <span class="hint">0 にするとクリックするまで残ります。</span>
        </span>
        <span class="with-unit"><input type="number" id="durationSec" min="0" max="120" step="1" /> 秒</span>
      </label>

      <label class="row">
        <span class="label">同時に出す最大数</span>
        <span class="with-unit"><input type="number" id="maxToasts" min="1" max="10" step="1" /> 件</span>
      </label>

      <label class="row">
        <span>
          <span class="label">1 回の確認で通知する上限</span>
          <span class="hint">まとめて届いたときに画面が埋まるのを防ぎます。</span>
        </span>
        <span class="with-unit"><input type="number" id="maxPerCheck" min="1" max="20" step="1" /> 件</span>
      </label>

      <label class="row switch-row">
        <span class="label">差出人を表示する</span>
        <input type="checkbox" id="showSender" />
      </label>

      <label class="row switch-row">
        <span>
          <span class="label">本文の冒頭を表示する</span>
          <span class="hint">オフにすると件名だけの最小表示になります。</span>
        </span>
        <input type="checkbox" id="showSnippet" />
      </label>

      <label class="row">
        <span class="label">アカウント名の表示</span>
        <select id="showAccount">
          <option value="auto">複数アカウントのときだけ</option>
          <option value="always">常に表示</option>
          <option value="never">表示しない</option>
        </select>
      </label>

      <label class="row switch-row">
        <span class="label">通知音を鳴らす</span>
        <input type="checkbox" id="sound" />
      </label>
    </section>

    <section class="card">
      <h2>通知しない条件</h2>
      <label class="row switch-row">
        <span>
          <span class="label">Gmail を開いているときは通知しない</span>
          <span class="hint">Gmail のタブを見ている間はトーストを出しません。</span>
        </span>
        <input type="checkbox" id="skipWhenGmailActive" />
      </label>

      <label class="row column">
        <span>
          <span class="label">除外キーワード</span>
          <span class="hint">1 行に 1 語。件名・差出人に含まれるメールは通知しません。</span>
        </span>
        <textarea id="muteKeywords" rows="4" placeholder="広告&#10;newsletter"></textarea>
      </label>

      <label class="row switch-row">
        <span>
          <span class="label">未読件数をアイコンに表示する</span>
          <span class="hint">ツールバーのバッジに未読数を出します。</span>
        </span>
        <input type="checkbox" id="badge" />
      </label>
    </section>

    <footer class="actions">
      <button type="button" id="test" class="ghost">テスト表示</button>
      <button type="button" id="check" class="ghost">今すぐ確認</button>
      <button type="button" id="reset" class="ghost danger">既定に戻す</button>
      <p id="saved" class="saved" role="status"></p>
    </footer>
  </main>
  <script src="../content/toast.js"></script>
  <script src="options.js"></script>
</body>
</html>
