<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Gmail 新着トースト</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="head">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="5" width="19" height="14" rx="2.5" /><path d="M3 7l9 6.5L21 7" />
        </svg>
      </span>
      <div>
        <h1>Gmail 新着トースト</h1>
        <p id="status" class="status">確認中…</p>
      </div>
    </div>
    <label class="switch" title="通知の有効 / 無効">
      <input type="checkbox" id="enabled" />
      <span class="track" aria-hidden="true"></span>
    </label>
  </header>

  <section id="accounts" class="accounts" hidden></section>

  <section class="list-wrap">
    <div class="list-head">
      <h2>新着</h2>
      <button type="button" id="clear" class="link">一覧を消す</button>
    </div>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty">新着はまだありません。</p>
  </section>

  <footer class="foot">
    <button type="button" id="check" class="primary">今すぐ確認</button>
    <button type="button" id="options" class="ghost">設定</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
